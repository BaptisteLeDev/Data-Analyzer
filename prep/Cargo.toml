[package]
name = "prep"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
dbase = "0.5"
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
